{% extends 'base.html' %}{% block content %}<section class="auth card"><p class="eyebrow">CAMPUS COMMUNITY</p><h1>{% if mode == 'register' %}처음 오셨나요?{% else %}다시 만나 반가워요{% endif %}</h1><p class="muted">캠퍼스 이야기를 함께 나눠요.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>아이디<input name="username" required minlength="3" maxlength="32" autocomplete="username" pattern="[A-Za-z0-9_]+"></label><label>비밀번호<input type="password" name="password" required minlength="8" maxlength="128" autocomplete="{% if mode == 'register' %}new-password{% else %}current-password{% endif %}"></label><button>{% if mode == 'register' %}가입하기{% else %}로그인{% endif %}</button></form>{% if mode == 'register' %}<p>이미 계정이 있나요? <a href="{{ url_for('login') }}">로그인</a></p>{% else %}<p>처음인가요? <a href="{{ url_for('register') }}">회원가입</a></p>{% endif %}</section>{% endblock %}
