<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>캠퍼스 별 모으기</title><link rel="stylesheet" href="styles.css"></head><body><header><a class="brand" href="index.html">CAMPUS NOTES <span>· 04</span></a><nav class="nav" aria-label="주요 메뉴"><a href="index.html">장소 탐색</a><a href="statistics.html">데이터 살펴보기</a><a href="game.html">별 모으기</a></nav></header><main><div class="hero"><p class="eyebrow">CAMPUS GAME</p><h1>캠퍼스 별 모으기</h1><p>30초 동안 별을 모아 보세요. 별은 1점, 돌에 닿으면 생명 1개가 줄어듭니다. 시간이 끝나거나 생명이 0이 되면 종료됩니다.</p><p>방향키 또는 WASD로 이동하거나 화면을 누르고 끌어 이동하세요.</p></div><div class="game-board"><div class="hud"><span>점수 <b id="score">0</b></span><span>생명 <b id="lives">3</b></span><span>남은 시간 <b id="time">30</b>초</span></div><div class="controls"><button id="start">시작하기</button><button id="restart" hidden>다시 하기</button></div><canvas id="game" width="800" height="460" aria-label="별 모으기 게임 화면"></canvas><p class="game-end" id="message" role="status">시작 버튼을 누르세요.</p></div></main><script src="game.js"></script></body></html>
