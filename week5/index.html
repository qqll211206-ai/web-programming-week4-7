<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>캠퍼스 하루 취향 밸런스 게임</title><link rel="icon" href="data:,">
<style>
:root{font-family:system-ui,"Malgun Gothic",sans-serif;color:#193b36;background:#f4f5ec;line-height:1.6}*{box-sizing:border-box}body{margin:0}header{background:#183c38;color:#fff;padding:1.2rem max(1.2rem,calc((100vw - 1060px)/2))}.brand{font-weight:800;letter-spacing:.14em;font-size:.85rem}main{max-width:1060px;margin:auto;padding:2rem 1.25rem 5rem}h1{font-size:clamp(2.2rem,6vw,4.5rem);line-height:1.16;letter-spacing:-.05em;margin:.5rem 0 1rem}.eyebrow{color:#62816c;font-weight:700;letter-spacing:.15em;font-size:.78rem}.intro{max-width:650px;color:#52675c}.layout{display:grid;grid-template-columns:1.4fr 1fr;gap:1rem;align-items:start;margin-top:2rem}.card{background:white;border:1px solid #dfe9df;border-radius:12px;padding:clamp(1.2rem,3vw,2rem);box-shadow:0 10px 30px #163e3109}.card h2{margin-top:0;line-height:1.35}.tag{color:#5d7867;font-size:.85rem;font-weight:700}.choices{display:grid;gap:.75rem;margin:1.5rem 0}button{font:inherit;min-height:48px;padding:.7rem 1rem;border:1px solid #9ab3a2;border-radius:8px;background:#fff;color:#183c38;cursor:pointer}button:hover{background:#eaf2e7}button.primary{background:#245e4f;color:white;border-color:#245e4f;font-weight:700}button.choice{text-align:left;font-weight:700;padding:1rem}button.danger{color:#8c3434}button:focus-visible,input:focus-visible{outline:3px solid #c78b2c;outline-offset:2px}input{font:inherit;width:100%;max-width:340px;padding:.75rem;border:1px solid #9ab3a2;border-radius:8px}label{display:block;font-weight:700;margin-bottom:.4rem}.actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}.hint,.small{color:#62746a;font-size:.88rem}.warning{color:#8b3c29;font-weight:600;white-space:pre-line}.progress{height:7px;background:#e7eee5;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:#86aa78;transition:width .2s}.result-icon{font-size:2.5rem}.history{list-style:none;padding:0}.history li{border-top:1px solid #e3ebe2;padding:1rem 0}.history p{margin:.3rem 0}.history button{min-height:40px;font-size:.85rem}.empty{color:#6a7c70}[hidden]{display:none!important}@media(max-width:720px){.layout{grid-template-columns:1fr}main{padding-top:1.4rem}.card{padding:1.2rem}.actions button{flex:1}}
</style></head>
<body><header><span class="brand">CAMPUS NOTES · 05</span></header><main>
<div class="intro"><p class="eyebrow">CAMPUS BALANCE GAME</p><h1>당신의 캠퍼스는<br>어떤 하루인가요?</h1><p>여덟 가지 선택으로 나만의 하루를 그려 보세요. 친구와 이어서 즐기고 서로의 취향도 비교할 수 있어요.</p></div>
<p id="notice" class="warning" role="status" aria-live="polite"></p>
<div class="layout"><section class="card" aria-label="게임"><div id="game"></div></section>
<aside class="card"><p class="eyebrow">SAVED MOMENTS</p><h2>내 저장 데이터</h2><p class="hint">이 기기의 브라우저에만 저장됩니다.</p><div class="actions"><button id="refresh-storage">저장 데이터 다시 보기</button><button id="delete-draft" class="danger">진행 기록 삭제</button><button id="clear-history" class="danger">완료 기록 모두 삭제</button></div><p id="draft-summary" class="small"></p><ul id="history" class="history"></ul></aside></div>
</main><script src="game.js"></script></body></html>
