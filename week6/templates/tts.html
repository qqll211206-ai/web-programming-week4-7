<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>캠퍼스 영어 방송</title><link rel="icon" href="data:,"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><header><span>CAMPUS LAB · 06</span></header><main><p class="eyebrow">LOCAL PIPER TTS</p><h1>캠퍼스 영어 방송</h1><p class="lead">영어 문장을 입력하면 서버에서 음성을 만들고 실제 파형을 보여 줍니다.</p><section class="card"><p>방송 문장 예시</p><div class="actions"><button type="button" class="secondary preset" data-text="Welcome to our campus. The library is open until nine tonight.">도서관 안내</button><button type="button" class="secondary preset" data-text="Please join us on the lawn for the student club fair this afternoon.">동아리 행사 안내</button></div><form id="tts-form"><label>영어 문장 · 최대 500자<textarea id="text" maxlength="500" required rows="5" placeholder="Welcome to our campus."></textarea></label><label>발화 길이 배율<select id="scale"><option value="0.8">0.8 · 빠르게</option><option value="1" selected>1.0 · 기본</option><option value="1.2">1.2 · 느리게</option></select></label><button id="tts-button">음성 만들기</button></form><p id="status" role="status" aria-live="polite"></p><p id="metrics" class="metrics"></p><canvas id="waveform" width="960" height="220" aria-label="생성된 음성 파형"></canvas><audio id="audio" controls hidden></audio><a id="download" download="campus-speech.wav" hidden>WAV 다운로드</a></section></main><script src="{{ url_for('static', filename='tts.js') }}"></script></body></html>
