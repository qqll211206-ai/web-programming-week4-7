<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>캠퍼스 이미지 실험실</title><link rel="icon" href="data:,"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><span>CAMPUS LAB · 06</span></header><main><p class="eyebrow">SERVER-SIDE IMAGE PROCESSING</p><h1>사진을 새로운<br>시선으로</h1><p class="lead">사진을 선택하고 세 가지 영상 처리 효과를 비교해 보세요. 이미지는 서버 메모리에서 처리됩니다.</p>
<section class="card"><form id="image-form" action="/api/process" method="post" enctype="multipart/form-data"><div class="fields"><label>JPEG 또는 PNG · 최대 5 MiB<input required type="file" name="image" accept="image/jpeg,image/png"></label><label>효과<select name="operation"><option value="grayscale">흑백 · Grayscale</option><option value="blur">흐리게 · Gaussian Blur</option><option value="canny">윤곽선 · Canny</option></select></label><label>흐림 커널 크기 · 홀수 3–51<input type="number" name="kernel" min="3" max="51" step="2" value="3" required></label></div><div class="actions"><button id="fetch-button" type="button">페이지에서 비교하기</button><button type="submit" class="secondary">일반 폼으로 PNG 열기</button></div></form><p id="status" role="status" aria-live="polite"></p><p id="times" class="metrics"></p></section>
<div class="image-grid"><section class="card"><h2>원본</h2><img id="original" alt="선택한 원본 이미지" hidden></section><section class="card"><h2>서버 처리 결과</h2><img id="result" alt="처리된 이미지" hidden></section></div><p class="hint">계산 시간은 알고리즘만, 서버 처리 시간은 디코딩·처리·인코딩을, 왕복 시간은 요청과 응답을 포함합니다.</p></main><script src="{{ url_for('static', filename='image.js') }}"></script></body></html>
